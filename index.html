<head>

    <title>BlockAR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            display: flex;
            justify-content: center;

        }

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 40px 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 22px;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
        }

        h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 800;
        }

        .subtitle {
            margin: 12px 0 30px;
            color: #dbeafe;
            font-size: 16px;
            line-height: 1.5;
        }

        /* The AR Quick Look link */
        .ar-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 17px 24px;
            border-radius: 16px;
            background: white;
            color: #1d4ed8;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .ar-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.25);
        }

        .ar-button:active {
            transform: scale(0.98);
        }

        .ar-icon {
            font-size: 24px;
        }

        .instructions {
            margin-top: 25px;
            padding: 16px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.15);

</head>
